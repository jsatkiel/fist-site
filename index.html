<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>It works!</title>
  <meta name="description" content="A starter page, built by Claude and hosted on Cloudflare Pages.">
  <style>
    :root {
      --bg: #f7f5f0;
      --ink: #1d1d1b;
      --muted: #5c5a55;
      --accent: #e0662b;
      --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161614; --ink: #f2f0ea; --muted: #a8a59d; --card: #22211e; }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--ink);
      font: 18px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      max-width: 560px;
      width: 100%;
      background: var(--card);
      border-radius: 20px;
      padding: 48px 36px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .dot {
      width: 64px; height: 64px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: var(--accent);
      display: grid; place-items: center;
      color: #fff; font-size: 32px;
    }
    h1 { font-size: 2.2rem; line-height: 1.2; margin-bottom: 12px; }
    p { color: var(--muted); }
    footer { margin-top: 32px; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="dot" aria-hidden="true">✓</div>
    <h1>Your first site is live.</h1>
    <p>This page is built by Claude, stored on GitHub, and hosted for free on Cloudflare Pages. Every change pushed from now on goes live automatically.</p>
    <footer>Starter page · replace me with something great</footer>
  </main>
</body>
</html>
